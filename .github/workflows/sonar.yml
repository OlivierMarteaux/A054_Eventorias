      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: run emulator androidTest and sonar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: test
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 600 # wait up to 10 minutes
          script: ./gradlew connectedAndroidTest sonar --info
